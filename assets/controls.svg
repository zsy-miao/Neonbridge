<rect x="1130" y="120" width="120" height="210" rx="60" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<path d="M1130 180 A60 60 0 0 1 1190 120 V210 H1130 Z" fill="#3fb950" fill-opacity="0.18" stroke="#3fb950" stroke-width="2"/>
<path d="M1190 120 A60 60 0 0 1 1250 180 V210 H1190 Z" fill="#f0883e" fill-opacity="0.18" stroke="#f0883e" stroke-width="2"/>
<text x="1160" y="175" class="p" fill="#3fb950" text-anchor="middle">A</text>
<text x="1160" y="195" class="s" text-anchor="middle">RT*</text>
<text x="1220" y="175" class="p" fill="#f0883e" text-anchor="middle">LT</text>
<text x="1220" y="195" class="s" text-anchor="middle">aim</text>
<text x="1190" y="280" class="s" text-anchor="middle">move = R stick</text>
<text x="1190" y="296" class="s" text-anchor="middle">while aiming</text>
<text x="40" y="372" class="s">Coloured keys map to pad inputs. *Left click fires (RT) while right click is held. The game window must be in front. TUXBOX_KEYBOARD_GAMEPAD=0 turns this off.</text>
