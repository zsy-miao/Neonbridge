<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="GTA VI on PC progress: boot, intro, player select and menus done; gets past the loading screens into the first mission (sound plays, picture still black); playable still to come. Up to 22 fps, saves work, offline, keyboard works, audio works.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0618"/>
      <stop offset="1" stop-color="#1a0b33"/>
    </linearGradient>
    <linearGradient id="done" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ff2ff"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#ffd36e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="400" rx="18" fill="url(#bg)"/>
  <text x="60" y="62" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">GTA VI on PC: <tspan fill="url(#neon)">how far it gets</tspan></text>

  <!-- track -->
  <line x1="130" y1="160" x2="770" y2="160" stroke="url(#done)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="770" y1="160" x2="960" y2="160" stroke="#ff4fd8" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 10"/>
  <line x1="960" y1="160" x2="1150" y2="160" stroke="#3a2a5c" stroke-width="8" stroke-linecap="round"/>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- done -->
    <g filter="url(#glow)">
      <circle cx="130" cy="160" r="30" fill="#3ff2ff"/>
      <circle cx="290" cy="160" r="30" fill="#55c8ff"/>
      <circle cx="450" cy="160" r="30" fill="#6a8cff"/>
      <circle cx="610" cy="160" r="30" fill="#7a5cff"/>
      <circle cx="770" cy="160" r="30" fill="#9a4cf0"/>
    </g>
    <g fill="#0a0618" font-size="30" font-weight="800">
      <text x="130" y="171">✓</text><text x="290" y="171">✓</text><text x="450" y="171">✓</text><text x="610" y="171">✓</text><text x="770" y="171">✓</text>
    </g>
    <!-- in progress -->
    <circle cx="960" cy="160" r="30" fill="#1a0b33" stroke="#ff4fd8" stroke-width="5" filter="url(#glow)"/>
    <text x="960" y="170" font-size="28" font-weight="800" fill="#ff4fd8">…</text>
    <!-- to do -->
    <circle cx="1150" cy="160" r="30" fill="#1a0b33" stroke="#4a3a70" stroke-width="5"/>

    <g font-size="21" font-weight="700" fill="#ffffff">
      <text x="130" y="226">Boot</text>
      <text x="290" y="226">GTA stars intro</text>
      <text x="450" y="226">Player select</text>
      <text x="610" y="226">Into menus</text>
      <text x="770" y="226">Through menus</text>
      <text x="960" y="226" fill="#ff8ae6">Load the world</text>
      <text x="1150" y="226" fill="#8f7fc0">Playable</text>
    </g>
    <g font-size="15" fill="#b8a8e8">
      <text x="610" y="250">auto A press</text>
      <text x="960" y="250">mission audio, black picture</text>
    </g>
  </g>

  <!-- chips -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700">
    <rect x="60" y="300" width="200" height="54" rx="27" fill="#16102c" stroke="#3ff2ff" stroke-width="2"/>
    <text x="160" y="334" text-anchor="middle" fill="#3ff2ff">⚡ up to 22 fps</text>
    <rect x="280" y="300" width="200" height="54" rx="27" fill="#16102c" stroke="#3ff2ff" stroke-width="2"/>
    <text x="380" y="334" text-anchor="middle" fill="#3ff2ff">💾 Saves work</text>
    <rect x="500" y="300" width="200" height="54" rx="27" fill="#16102c" stroke="#3ff2ff" stroke-width="2"/>
    <text x="600" y="334" text-anchor="middle" fill="#3ff2ff">⌨ Keyboard pad</text>
    <rect x="720" y="300" width="230" height="54" rx="27" fill="#16102c" stroke="#3ff2ff" stroke-width="2"/>
    <text x="835" y="334" text-anchor="middle" fill="#3ff2ff">🔒 Offline by default</text>
    <rect x="970" y="300" width="250" height="54" rx="27" fill="#16102c" stroke="#3ff2ff" stroke-width="2"/>
    <text x="1095" y="334" text-anchor="middle" fill="#3ff2ff">🔊 Audio works</text>
  </g>
</svg>
