<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="How Neonbridge works: the GTA VI Xbox executable runs natively on the x64 CPU; its console DLL calls go to TuxBox Rust providers, which call Windows D3D12, files, input and audio.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0618"/>
      <stop offset="1" stop-color="#1a0b33"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#ffd36e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ff2ff"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ffd36e"/>
    </marker>
  </defs>
  <rect width="1280" height="420" rx="18" fill="url(#bg)"/>
  <text x="60" y="62" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">How it works: <tspan fill="url(#neon)">no full emulator</tspan></text>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <!-- game -->
    <rect x="60" y="110" width="300" height="250" rx="16" fill="#16102c" stroke="#ff4fd8" stroke-width="3" filter="url(#glow)"/>
    <text x="210" y="160" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">GTA VI</text>
    <text x="210" y="190" text-anchor="middle" font-size="16" fill="#d8c7ff">Xbox Series build</text>
    <text x="210" y="214" text-anchor="middle" font-size="15" font-family="Consolas, Menlo, monospace" fill="#8f7fc0">game_scarlett_master.exe</text>
    <text x="210" y="270" text-anchor="middle" font-size="17" font-weight="700" fill="#3ff2ff">x64 code runs</text>
    <text x="210" y="294" text-anchor="middle" font-size="17" font-weight="700" fill="#3ff2ff">natively on your CPU</text>
    <text x="210" y="334" text-anchor="middle" font-size="14" fill="#8f7fc0">your own dump, never included</text>

    <!-- arrow 1 -->
    <line x1="370" y1="235" x2="455" y2="235" stroke="#ffd36e" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="412" y="222" text-anchor="middle" font-size="14" fill="#ffd36e">console</text>
    <text x="412" y="262" text-anchor="middle" font-size="14" fill="#ffd36e">DLL calls</text>

    <!-- neonbridge -->
    <rect x="465" y="110" width="380" height="250" rx="16" fill="#16102c" stroke="url(#cyan)" stroke-width="3" filter="url(#glow)"/>
    <text x="655" y="152" text-anchor="middle" font-size="24" font-weight="800" fill="url(#neon)">Neonbridge</text>
    <text x="655" y="178" text-anchor="middle" font-size="15" fill="#d8c7ff">TuxBox Rust providers</text>
    <g font-size="15" font-family="Consolas, Menlo, monospace" fill="#ffffff" text-anchor="middle">
      <rect x="490" y="200" width="160" height="34" rx="8" fill="#241a45"/><text x="570" y="222">d3d12 + xshader</text>
      <rect x="660" y="200" width="160" height="34" rx="8" fill="#241a45"/><text x="740" y="222">xgameruntime</text>
      <rect x="490" y="244" width="160" height="34" rx="8" fill="#241a45"/><text x="570" y="266">xmem</text>
      <rect x="660" y="244" width="160" height="34" rx="8" fill="#241a45"/><text x="740" y="266">gameinput</text>
      <rect x="490" y="288" width="160" height="34" rx="8" fill="#241a45"/><text x="570" y="310">xcrdapi</text>
      <rect x="660" y="288" width="160" height="34" rx="8" fill="#241a45"/><text x="740" y="310">acphal / xapu</text>
    </g>

    <!-- arrow 2 -->
    <line x1="855" y1="235" x2="940" y2="235" stroke="#ffd36e" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="897" y="222" text-anchor="middle" font-size="14" fill="#ffd36e">Windows</text>
    <text x="897" y="262" text-anchor="middle" font-size="14" fill="#ffd36e">calls</text>

    <!-- windows -->
    <rect x="950" y="110" width="270" height="250" rx="16" fill="#16102c" stroke="#3ff2ff" stroke-width="3" filter="url(#glow)"/>
    <text x="1085" y="160" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">Your PC</text>
    <g font-size="17" fill="#d8c7ff" text-anchor="middle">
      <text x="1085" y="205">🎮 D3D12 GPU</text>
      <text x="1085" y="240">📁 Files and saves</text>
      <text x="1085" y="275">⌨ Keyboard / XInput</text>
      <text x="1085" y="310">🔊 Windows audio</text>
    </g>
  </g>
  <text x="640" y="398" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#8f7fc0">Like Wine for Xbox Series: same x64 CPU family, so only the system layer is swapped.</text>
</svg>
