<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="6Launch: Xbox Series GDK executables, native on Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#151a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5ea8"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- chip with launch arrow -->
  <g transform="translate(120 70)">
    <rect x="0" y="0" width="180" height="180" rx="28" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round">
      <path d="M45 -18V0M90 -18V0M135 -18V0"/>
      <path d="M45 180V198M90 180V198M135 180V198"/>
      <path d="M-18 45H0M-18 90H0M-18 135H0"/>
      <path d="M180 45H198M180 90H198M180 135H198"/>
    </g>
    <path d="M58 122L122 58M80 58H122V100" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="380" y="168" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="104" font-weight="800" fill="#ffffff" letter-spacing="-2">6<tspan fill="url(#accent)">Launch</tspan></text>
  <text x="384" y="222" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" fill="#aab3cf">Xbox Series GDK executables, native on Windows</text>
  <text x="384" y="262" font-family="Consolas, Menlo, monospace" font-size="20" fill="#6c7698">x64 runs natively · console DLLs → TuxBox Rust providers · D3D12</text>
