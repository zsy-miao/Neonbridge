<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Neonbridge: one launcher for every leader's GTA VI Xbox Series emulator">
  <defs>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b1a2e" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="#0b0b12"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.6"/>
  <rect width="1280" height="6" fill="#ff2e97"/>
  <rect y="314" width="1280" height="6" fill="#00e5ff"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="140" font-size="104" font-weight="800" letter-spacing="2" filter="url(#glow)"><tspan fill="#ff2e97">NEON</tspan><tspan fill="#00e5ff">BRIDGE</tspan></text>
    <rect x="76" y="164" width="300" height="6" fill="#ff2e97"/>
    <rect x="376" y="164" width="60" height="6" fill="#00e5ff"/>
    <text x="74" y="212" font-size="28" fill="#dedeec">Test them all in one convenient launcher.</text>

    <g font-size="20" font-weight="600" fill="#dedeec">
      <rect x="74" y="244" width="80" height="40" rx="20" fill="#16152a" stroke="#00e5ff"/>
      <text x="114" y="271" text-anchor="middle">KLBF</text>
      <rect x="166" y="244" width="124" height="40" rx="20" fill="#16152a" stroke="#00e5ff"/>
      <text x="228" y="271" text-anchor="middle">Flamingo</text>
      <rect x="302" y="244" width="168" height="40" rx="20" fill="#16152a" stroke="#00e5ff"/>
      <text x="386" y="271" text-anchor="middle">victory-fork</text>
      <rect x="482" y="244" width="146" height="40" rx="20" fill="#16152a" stroke="#00e5ff"/>
      <text x="555" y="271" text-anchor="middle">VI-BR-PORT</text>
      <rect x="640" y="244" width="113" height="40" rx="20" fill="#16152a" stroke="#00e5ff"/>
      <text x="696" y="271" text-anchor="middle">Belobug</text>
      <rect x="765" y="244" width="135" height="40" rx="20" fill="#16152a" stroke="#00e5ff"/>
      <text x="832" y="271" text-anchor="middle">VItoriaBr</text>
      <rect x="912" y="244" width="168" height="40" rx="20" fill="#16152a" stroke="#00e5ff"/>
      <text x="996" y="271" text-anchor="middle">ScarlettPort</text>
    </g>

    <rect x="1036" y="58" width="176" height="48" rx="24" fill="#ff2e97"/>
    <text x="1124" y="90" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">WIP · v0.3.0</text>
  </g>
</svg>
