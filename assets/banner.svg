<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Neonbridge: Xbox Series GDK executables, native on Windows">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0618"/>
      <stop offset="0.6" stop-color="#1a0b33"/>
      <stop offset="1" stop-color="#2b0d3f"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36e"/>
      <stop offset="0.5" stop-color="#ff6fa3"/>
      <stop offset="1" stop-color="#b23cff"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="0.5" stop-color="#ff8a5c"/>
      <stop offset="1" stop-color="#ffd36e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ff2ff"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sunclip"><rect x="0" y="0" width="1280" height="236"/></clipPath>
    <mask id="stripes">
      <rect x="0" y="0" width="1280" height="320" fill="#fff"/>
      <g fill="#000">
        <rect x="0" y="176" width="1280" height="4"/>
        <rect x="0" y="192" width="1280" height="6"/>
        <rect x="0" y="208" width="1280" height="8"/>
        <rect x="0" y="224" width="1280" height="10"/>
      </g>
    </mask>
  </defs>

  <rect width="1280" height="320" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="70" cy="40" r="1.4" opacity="0.7"/><circle cx="420" cy="30" r="1.2" opacity="0.5"/>
    <circle cx="610" cy="58" r="1.6" opacity="0.6"/><circle cx="840" cy="26" r="1.2" opacity="0.6"/>
    <circle cx="1010" cy="70" r="1.5" opacity="0.5"/><circle cx="1210" cy="36" r="1.3" opacity="0.7"/>
    <circle cx="1150" cy="120" r="1.1" opacity="0.4"/><circle cx="330" cy="96" r="1.1" opacity="0.4"/>
  </g>

  <!-- sunset sun -->
  <g clip-path="url(#sunclip)" mask="url(#stripes)">
    <circle cx="225" cy="196" r="118" fill="url(#sun)" filter="url(#glow)"/>
  </g>

  <!-- horizon grid -->
  <g stroke="#ff4fd8" stroke-opacity="0.55" stroke-width="1.5">
    <line x1="0" y1="236" x2="1280" y2="236" stroke-opacity="0.9"/>
    <line x1="0" y1="248" x2="1280" y2="248"/>
    <line x1="0" y1="264" x2="1280" y2="264"/>
    <line x1="0" y1="286" x2="1280" y2="286"/>
    <line x1="0" y1="314" x2="1280" y2="314"/>
    <path d="M225 236L-200 320M225 236L-40 320M225 236L100 320M225 236L225 320M225 236L350 320M225 236L490 320M225 236L650 320" fill="none"/>
  </g>

  <!-- neon bridge: console side to PC side -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M60 236Q225 70 390 236" stroke="url(#cyan)" stroke-width="6"/>
    <path d="M60 236H390" stroke="url(#cyan)" stroke-width="5"/>
    <g stroke="#3ff2ff" stroke-width="2.5" stroke-opacity="0.85">
      <path d="M110 236V180M160 236V146M225 236V138M290 236V146M340 236V180"/>
    </g>
  </g>

  <text x="470" y="168" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="100" font-weight="800" letter-spacing="-2" filter="url(#glow)"><tspan fill="#ffffff">Neon</tspan><tspan fill="url(#neon)">bridge</tspan></text>
  <text x="474" y="216" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#d8c7ff">Xbox Series GDK executables, native on Windows</text>
  <text x="474" y="254" font-family="Consolas, Menlo, monospace" font-size="19" fill="#8f7fc0">x64 runs natively · console DLLs → TuxBox Rust providers · D3D12</text>
</svg>
