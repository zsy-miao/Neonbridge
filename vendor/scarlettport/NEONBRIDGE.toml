# ScarlettPort's victory runtime (runtime/victory). Its second runtime, runtime/xcl, is a distinct
# playable path (scripts/setup.ps1:15 `cargo build --release` in runtime\xcl -> runtime\xcl\target\release\xcl.exe,
# scripts/play.ps1:34 `xcl run <game>` with XCL_DXC_THREADS=4, XCL_NO_WATCHDOG=1, XCL_PRESS_FILE); not modelled here.
name = "scarlettport"
rank = 7   # launcher list order (Master)
about = "ScarlettPort 925f90a (victory runtime), GPL-3.0"
upstream = "https://github.com/ZigZagBoi1/ScarlettPort"
# scripts/setup-victory.ps1:18,21 (run in runtime\victory; --manifest-path keeps that workspace's own target dir)
build = ["cargo", "rustc", "--manifest-path", "runtime/victory/Cargo.toml", "--release", "-p", "victory", "--bin", "victory", "--features", "diagnostics", "--locked", "--", "-C", "link-arg=/EXPORT:D3D12SDKVersion,DATA", "-C", "link-arg=/EXPORT:D3D12SDKPath,DATA"]
watch = ["runtime/victory/apps", "runtime/victory/crates", "runtime/victory/Cargo.toml", "runtime/victory/Cargo.lock"]
exe = "runtime/victory/target/release/victory.exe"   # scripts/play-victory.ps1:42
# NEONBRIDGE_DIAG (on unless 0): the author's diagnostics build, used in place of build/exe; [] = none.
diag_build = []   # its default build already has --features diagnostics (play-victory.ps1 build, as above): nothing else to switch
cwd = "runtime/victory/target/release"
run = ["run", "{game_exe}", "--execute", "--console", "series-s"]   # play-victory.ps1:24,45,88
prewarm = ["warm", "{game}", "--jobs", "{jobs}"]   # docs/RUNTIMES.md:81 (victory warm: translates every shader and makes the compute pipelines)
# Second prewarm phase, as ScarlettPort launcher 0.3 runs it after warm (shaderbuild.rs:272, engine.rs:63-75):
# repeat with {skip} = 0, 1000, 2000, ... until a run's summary line "precompile-graphics  <N> records: ..."
# (engine.rs:145 parse_graphics_end) gives N < 1000. Each run saves the pipeline library when it ends.
# NEONBRIDGE_PRECOMPILE_GRAPHICS=0 skips it. Needed because play runs set VICTORY_PRECOMPILED_GRAPHICS=1 (engine.rs:22).
prewarm_graphics = ["precompile-graphics", "{game}/shaders.rpf", "--jobs", "{jobs}", "--skip", "{skip}", "--limit", "1000"]
game_env = "VICTORY_GAME_DIR"       # play-victory.ps1:50
cache_env = "VICTORY_CACHE_DIR"   # Neonbridge: this runtime's own %LOCALAPPDATA%\6ixpack\scarlettport\cache (translators differ)
agility = true                      # setup-victory.ps1:27-38 (Agility 1.614.1 into <exe dir>\D3D12)

# options: KEY=values (default X): text. Env names grepped from the Rust source (first read site); defaults "unset" unless noted
