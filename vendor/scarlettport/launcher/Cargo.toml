[package]
name = "scarlettport-launcher"
version = "0.3.1"
edition = "2021"
description = "ScarlettPort desktop launcher"
license = "MIT"

[[bin]]
name = "ScarlettPort"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
rfd = "0.15"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_System_Registry"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
