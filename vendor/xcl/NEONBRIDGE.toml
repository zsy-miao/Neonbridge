name = "xcl"
rank = 5   # launcher list order (Master)
about = "xcl 6d12f58, GPL-2.0"
upstream = "https://github.com/ivall/xcl"
build = ["cargo", "build", "--release", "--workspace", "--locked"]   # README.md:98,216 (+--locked)
watch = ["crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/xcl.exe"   # README.md:216
# NEONBRIDGE_DIAG (on unless 0): the author's diagnostics build, used in place of build/exe; [] = none.
diag_build = []   # none: README.md:98,216 name only the release build (XCL_DRED is a run switch, preset_dred)
cwd = "target/release"
run = ["run", "{game}"]   # README.md:110,219
prewarm = ["shaders", "{game}/shaders.rpf", "--precompile", "--pipelines"]   # README.md:222; ScarlettPort setup.ps1:38-39
agility = true   # README.md:194-197: Agility D3D12Core.dll in <exe dir>\D3D12 (runtime-loaded, no PE export; Win10 only)

# options: KEY=values (default X): text. Env names grepped from the Rust source (first read site); defaults "unset" unless noted
