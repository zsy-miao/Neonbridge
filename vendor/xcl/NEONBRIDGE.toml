preset_dred = ["XCL_DRED=1"]
[env]

# Keyboard and mouse as the gamepad (keyboard_mouse in xcl.toml, on by
# default), shown by the controls overlay (F1). From crates/xcl/src/hle/kbm.rs
# (module table, VK_KEYS, SC_KEYS) and hle/gameinput.rs keyboard() KEYS; a real
# controller plays as well.
[controls]
left_stick = "W A S D"
right_stick = "Mouse"
a = "Space / Enter"
b = "Esc / Backspace"
x = "Q"
y = "E"
lb = "Wheel down"
rb = "Wheel up"
lt = "Right mouse"
rt = "Left mouse"
ls = "Left Shift"
rs = "Left Ctrl / Middle mouse"
dpad = "Arrows"
view = "Tab"
menu = "P"
