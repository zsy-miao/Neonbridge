# Publishes docs/wiki to the GitHub wiki. The wiki is generated: edit docs/wiki, never the Wiki tab.
# Links are written as Page.md so they work when browsing the repository; the wiki needs them without ".md".
name: Wiki

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The wiki repository exists once the Wiki tab is on and its first page was created (private repositories
          # have a wiki only on paid plans); until then there is nothing to publish to.
          if ! git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::notice::No wiki repository yet: turn on the Wiki tab and create its first page, then run this again."
            exit 0
          fi
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r docs/wiki/. wiki/
          find wiki -name '*.md' -exec sed -i -E 's/\]\(([A-Za-z0-9_-]+)\.md(#[^)]*)?\)/](\1\2)/g' {} +
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is up to date."
            exit 0
          fi
          git commit -m "Sync from ${GITHUB_SHA::7}"
          git push
