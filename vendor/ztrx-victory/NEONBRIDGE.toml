name = "ztrx"
rank = 6   # launcher list order (Master)
about = "ztrx victory 90b529f, GPL-3.0"
upstream = "https://github.com/Zettrox/ztrx"
build = ["cargo", "build", "--release", "-p", "victory", "--locked"]   # README.md:31 (+--locked)
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/victory.exe"   # scripts/play.ps1:6
cwd = "target/release"
run = ["run", "{game}", "--execute"]   # scripts/play.ps1:14 (passes the game dir, no --console)
# no prewarm: play.ps1 has none and `translate` has no --warm (apps/victory/src/main.rs:72-87)
cache_env = "VICTORY_CACHE_DIR"   # Neonbridge: this runtime's own %LOCALAPPDATA%\6ixpack\ztrx-victory\cache (translators differ)
agility = false   # no D3D12SDKVersion/D3D12SDKPath export in the tree

