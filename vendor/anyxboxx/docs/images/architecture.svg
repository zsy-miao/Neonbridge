  <g fill="#1d2230">
    <text x="40" y="90" font-weight="600">GDK package</text>
    <text x="40" y="112">MicrosoftGame.Config</text>
    <text x="40" y="130">PE32+ x86-64 executable</text>
    <text x="270" y="90" font-weight="600">emu/config.py</text>
    <text x="270" y="112">TitleId, Identity,</text>
    <text x="270" y="130">“Scarlett” executable</text>
    <text x="500" y="90" font-weight="600">emu/loader.py · emu/modules.py</text>
    <text x="500" y="112">sections, relocations, TLS, exports and ordinals;</text>
    <text x="500" y="130">package DLLs loaded and linked together</text>
    <text x="270" y="222" font-weight="600">emu/machine.py</text>
    <text x="270" y="244">Unicorn x86-64 (Zen 2)</text>
    <text x="270" y="262">stack, heap, TEB/PEB (GS)</text>
    <text x="270" y="280">instruction budget</text>
    <text x="500" y="222" font-weight="600">emu/hle — HLE page</text>
    <text x="500" y="244">gdk.py: xgameruntime (XSystem*, XMem*, XTaskQueue*)</text>
    <text x="500" y="262">kernel.py, library.py: time, heap, TLS, modules</text>
    <text x="500" y="280">crt.py + guest.py: malloc, memcpy, _initterm</text>
    <text x="40" y="222" font-weight="600">scarlett.py</text>
    <text x="40" y="244">Tkinter interface</text>
    <text x="40" y="262">log, report</text>
    <text x="40" y="280">--demo · --rapport · --banc</text>
    <text x="40" y="298">--natif → emu/native (Wine)</text>
  </g>
