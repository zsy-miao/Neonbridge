[package]
name = "tuxbox-xgameruntime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_IO",
    "Win32_System_LibraryLoader", "Win32_System_WindowsProgramming",
] }
