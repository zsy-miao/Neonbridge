name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -q

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Cargo.toml declares rust-version 1.95. Linux `cargo test --workspace`
      # does not build: windows-future looks up IMarshal on the Linux target.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tools/shader-compiler -> target
      - name: DXBC tests
        run: cargo test --locked --target x86_64-unknown-linux-gnu -p tuxbox-dxbc --features native-bindings
      - name: XG layout tests
        run: cargo test --locked --target x86_64-unknown-linux-gnu -p tuxbox-xg-layout
      - name: Shader compiler tests
        run: cargo test --locked --target x86_64-unknown-linux-gnu --manifest-path tools/shader-compiler/Cargo.toml
      - name: D3D12 Windows typecheck
        run: cargo check --locked --target x86_64-pc-windows-msvc -p tuxbox-d3d12
