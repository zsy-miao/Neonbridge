[workspace]
members = [
    "runtime/acphal", "runtime/bvh", "runtime/d3d12", "runtime/dxbc", "runtime/dxc", "runtime/gameinput",
    "runtime/xapu", "runtime/xg", "runtime/xcrdapi", "runtime/xg-layout", "runtime/xgameruntime", "runtime/xmem", "runtime/xmem/http", "tools/pipeline-prep",
]
resolver = "3"

[workspace.package]
edition = "2024"
# LazyLock::get (1.94) and the atomic try_update methods (1.95) are used by the providers.
rust-version = "1.95"
publish = false

[workspace.dependencies]
windows = "0.61.3"
windows-sys = "0.61.2"

[profile.release]
panic = "abort"
