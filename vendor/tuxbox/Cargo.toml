[workspace]
members = [
    "runtime/acphal", "runtime/bvh", "runtime/d3d12", "runtime/dxbc", "runtime/dxc", "runtime/gameinput",
    "runtime/xapu", "runtime/xg", "runtime/xcrdapi", "runtime/xg-layout", "runtime/xgameruntime", "runtime/xmem", "runtime/xmem/http",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
windows = "0.61.3"
windows-sys = "0.61.2"

[profile.release]
panic = "abort"
