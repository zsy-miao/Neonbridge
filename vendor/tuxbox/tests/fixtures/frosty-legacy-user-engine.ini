[/Script/Engine.RendererSettings]
r.RayTracing=0

[ConsoleVariables]
r.Nanite=0
r.Forward.LightLinkedListCulling=0
r.Shadow.Virtual.Enable=0
r.Lumen.DiffuseIndirect.Allow=0
r.Lumen.Reflections.Allow=0

; Temporal upsampling keeps the material's automatic texture mip bias active.
; The conventional TAA pass resolves the code atlas at the reduced input size.
r.AntiAliasingMethod=2
r.TemporalAA.Upsampling=1
; Frosty presents at 3840x2160. Render the chase at 1280x720 internally.
r.ScreenPercentage=33.3333

r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.BloomQuality=0
r.AmbientOcclusionLevels=0

r.InstanceCulling.OcclusionCull=0
r.SSS.Scale=0
r.HairStrands.Strands=0

; Allow cold desktop shader compilation while streaming ConstructFurniture.
g.TimeoutForBlockOnRenderFence=300000

fx.NiagaraAllowGPUParticles=0
fx.NiagaraAllowComputeShaders=0
