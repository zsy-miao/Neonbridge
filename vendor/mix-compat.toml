# Produced by scratch static.py (pub-item name grep vs victory_<crate>:: uses in the host's other crates/apps; rough, ignores types),
# confirmed by `cargo check -p victory` of mixed scratch workspaces (host workspace + donor crate dir, donor's missing
# [workspace.dependencies] such as zlib-rs/miniz_oxide added). scarlettport is checked with rt-scarlettport.patch applied.
# API compatibility only: runtime behaviour, env flags and on-disk cache formats are NOT covered.
trees = ["victory", "vitoriabr", "ztrx-victory", "scarlettport"]
crates = ["victory-core", "victory-formats", "victory-game", "victory-gpu", "victory-hle", "victory-loader", "victory-pe", "victory-pipeline", "victory-shader"]
parts = ["app", "victory-core", "victory-formats", "victory-game", "victory-gpu", "victory-hle", "victory-loader", "victory-pe", "victory-pipeline", "victory-shader"]

[identical]
# groups of trees whose crate sources (src + Cargo.toml) hash identically; apps/victory differs in all four
"victory-core" = [["victory", "ztrx-victory"]]
"victory-game" = [["victory", "vitoriabr"]]
"victory-loader" = [["victory", "ztrx-victory"]]
"victory-pe" = [["victory", "ztrx-victory", "scarlettport"]]
"victory-pipeline" = [["victory", "vitoriabr", "ztrx-victory", "scarlettport"]]

[substitutes]
# "<crate>.<host>" = donor trees whose crate drops into host's workspace. checked = cargo check ok; static = API grep only
# (static is unreliable for host scarlettport: its formats/core uses were missed by the grep and failed cargo check)
"victory-core.victory" = { checked = ["scarlettport"], static = ["vitoriabr", "ztrx-victory"] }
"victory-core.vitoriabr" = { checked = [], static = ["victory", "ztrx-victory", "scarlettport"] }
