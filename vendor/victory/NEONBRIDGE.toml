# Neonbridge launcher spec for vendor/victory (src/runtimes.rs reads it).
# Settings are play-victory.ps1's (ScarlettPort scripts, credit to its authors);
# its user choices (VICTORY_FAST_BOOT, VICTORY_SAVE_SLOT, VICTORY_AUTO_INPUT)
# stay off unless set in the environment, which passes them on.
name = "victory"
about = "VIctory-fxceless 0b0074e (GPL-3.0), the emulator victory"
upstream = "https://github.com/fxceless/victory-fork"
# fxceless's victory has no Agility opt-in (no D3D12SDKVersion/D3D12SDKPath
# exports, unlike ScarlettPort's copy): it runs on the system's D3D12.
build = ["cargo", "build", "--release", "-p", "victory", "--bin", "victory", "--features", "diagnostics", "--locked"]
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/victory.exe"
run = ["run", "{game_exe}", "--execute", "--console", "series-s"]
# Every shader container in the game, CPU only (about 5 min).
prewarm = ["translate", "{game}", "--warm", "all", "--jobs", "{jobs}"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

options = [
  "VICTORY_FAST_CORES=0|1 (default 1): the submit and copy-back threads ask for the fast cores of a hybrid CPU (fxceless 0b0074e), read at crates/victory-gpu/src/framelog.rs:219",
  "VICTORY_DISK_CORES=slow (default off): the DirectStorage workers ask for the slow cores (fxceless 0b0074e), read at crates/victory-hle/src/modules/dstorage.rs:499",
]
[env]
VICTORY_RAYTRACING = "0"   # Neonbridge rt patch: the leader has no 0x3a8 build (method not implemented), so the build hook stays off as in the leader; vb2 removed the device on our RT build path
VICTORY_DATA_DIR = "%LOCALAPPDATA%\\6ixpack\\save"   # Neonbridge: one save/settings folder for the victory family (storage/settings identical across trees)
VICTORY_OWN_UPSCALER = "1"
VICTORY_NO_WATCHDOG = "1"
VICTORY_RELAY = "2"
VICTORY_SYNC_PRECISE = "1"
VICTORY_READ_SETTLE_PRECISE = "1"
VICTORY_PIPELINE_WAIT_MS = "0"
VICTORY_PRESS_FILE = "{press}"

# Keyboard as the gamepad, shown by the controls overlay (F1). From
# crates/victory-hle/src/modules/gameinput.rs FALLBACK_BUTTONS and fallback();
# a real controller plays as well.
[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
