name = "vitoriabr"
rank = 4   # launcher list order (Master)
about = "VItoriaBr 9ceb7e7, GPL-3.0"
upstream = "https://github.com/uiliannn/VItoriaBr"
build = ["cargo", "build", "--release", "-p", "victory", "--locked"]   # README.md:95 (+--locked; Cargo.lock vendored)
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/release/victory.exe"   # README.md:98
# NEONBRIDGE_DIAG (on unless 0): the author's diagnostics build, used in place of build/exe; [] = none.
diag_build = ["cargo", "build", "--profile", "diag", "-p", "victory", "--features", "diagnostics", "--locked"]   # README.md:128 (+--locked)
diag_exe = "target/diag/victory.exe"   # Cargo.toml:78 [profile.diag]
cwd = "target/release"
run = ["run", "{game_exe}", "--execute"]   # README.md:98,117 (no --console given)
game_env = "VICTORY_GAME_DIR"   # Neonbridge: the game folder for victory's config
cache_env = "VICTORY_CACHE_DIR"   # Neonbridge: this runtime's own %LOCALAPPDATA%\6ixpack\vitoriabr\cache (translators differ)
prewarm = ["translate", "{game}", "--warm", "all", "--jobs", "{jobs}"]   # Neonbridge: apps/victory/src/translate.rs:159 (`--warm all`: every container), as vendor/victory
agility = false   # no D3D12SDKVersion/D3D12SDKPath export anywhere in the tree

