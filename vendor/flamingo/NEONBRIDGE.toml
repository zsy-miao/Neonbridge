# Neonbridge launcher spec for vendor/flamingo: realblastex's Flamingo, a victory
# fork vendored clean. Build, run and env are its README.md "Building and running"
# (README.md:98-114). Its claim (README.md status table): about 14 fps facing the
# window and 9-12 fps in the room on an RTX 4070; shadowed areas dark.
name = "flamingo"
rank = 1   # launcher list order (Master)
about = "Flamingo 956a3b1 (GPL-3.0), unverified here: claims 9-14 fps in the first scene, shadows dark"
upstream = "https://github.com/realblastex/flamingo"
build = ["cargo", "build", "--profile", "diag", "-p", "victory", "--locked"]
watch = ["apps", "crates", "Cargo.toml", "Cargo.lock"]
exe = "target/diag/victory.exe"
run = ["run", "{game_exe}", "--execute", "--console", "series-s"]
prewarm = ["translate", "{game}", "--warm", "all", "--jobs", "{jobs}"]
game_env = "VICTORY_GAME_DIR"
cache_env = "VICTORY_CACHE_DIR"
agility = false

options = [
  "FLAMINGO_OSD=0|1: frame-rate overlay, README.md:44",
  "FLAMINGO_DUALSENSE=0: DualSense support off, README.md:50",
  "FLAMINGO_DISCORD=0: Discord Rich Presence off, README.md:122",
  "VICTORY_AMBIENT=<level>: constant in place of the indirect-light resolve, README.md:85",
  "VICTORY_AMBIENT_STUB=1, VICTORY_SHADOWMASK_STUB=1: ray-traced lighting stand-ins, README.md:79",
  "VICTORY_WIDE_TEXTURES=1 (victory-fork #768), README.md:74",
]
[env]
VICTORY_RAYTRACING = "0"   # Neonbridge rt patch off, as in the leader
VICTORY_DATA_DIR = "%LOCALAPPDATA%\\6ixpack\\save"   # Neonbridge: one save/settings folder for the victory family (storage/settings identical across trees)
VICTORY_NO_WATCHDOG = "1"   # README.md:104-113, its run settings
VICTORY_PIPELINE_WAIT_MS = "24"
VICTORY_RELAY = "1"
VICTORY_LATE_WAIT = "3"
VICTORY_CARD_BUFFERS_MIN_MB = "1"
VICTORY_CARD_BUFFERS_MB = "1024"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_SHADER_OPT = "0"
VICTORY_WIDE_MERGE = "1"
FLAMINGO_OSD = "1"
FLAMINGO_DISCORD = "0"   # Neonbridge: no presence sent out unless the user turns it on
VICTORY_PRESS_FILE = "{press}"

# Keyboard as the gamepad, shown by the controls overlay (F1). From
# crates/victory-hle/src/modules/gameinput.rs FALLBACK_BUTTONS and fallback();
# a real controller plays as well.
[controls]
left_stick = "W A S D"
right_stick = "I J K L"
a = "Enter"
b = "Backspace"
x = "X"
y = "Y"
lb = "Q"
rb = "E"
lt = "Z"
rt = "C"
ls = "F"
rs = "H"
dpad = "Arrows"
view = "Tab"
menu = "Esc"
