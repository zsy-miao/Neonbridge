[package]
name = "victory-loader"
description = "Runs an Xbox title's original x86-64 image natively inside our process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
victory-core.workspace = true
victory-pe.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
blake3.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

[features]
# Debugging switches (scheduled stack dumps and the like).
diagnostics = ["stacks"]
# Flamingo: scheduled stack dumps (`VICTORY_STACKS`) alone, for a sampling
# profile of a measured build.
stacks = []

[lints]
workspace = true
